<title id="title">Three bounded tasks on a local model, August 23 2026</title>
<desc id="desc">Leg C2 of the dirtywork soak: three bench tasks run by qwen3.6 via Ollama, each completed in 5 to 9 turns and 10.6 to 19.4 seconds, each using between 4.5 and 8.9 percent of the 262,144-token context window the model was loaded with. For each task, a stacked bar shows tool calls before finish split into explore, edit and check, and a meter shows prompt tokens used against the window.</desc>
