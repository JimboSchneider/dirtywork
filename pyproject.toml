[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dirtywork"
version = "0.13.0"
description = "Agentic tool-use loop harness for local LM Studio models — an expensive-model orchestrator's free local workforce"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Dirt Simple Solutions, LLC"}]
keywords = ["llm", "agent", "lm-studio", "local-llm", "coding-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Repository = "https://github.com/JimboSchneider/dirtywork"
Homepage = "https://dirtywork.run"

[project.scripts]
dirtywork = "dirtywork.__main__:main"

[tool.setuptools]
packages = ["dirtywork", "dirtywork.providers", "dirtywork.sandbox", "dirtywork.contract"]

[tool.setuptools.package-data]
"dirtywork.contract" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Belt and braces: testpaths alone stops bare `pytest`/`pytest -q` from
# walking bench/repos/*/tests (deliberately-failing solver fixtures), but a
# dev or CI invocation that passes an explicit path (e.g. `pytest bench/`)
# bypasses testpaths. norecursedirs keeps that path safe too.
norecursedirs = ["bench", "*/bench/*", ".git", ".worktrees", "*.egg-info"]
markers = [
    "live: requires a running LM Studio server",
    "docker: requires a running Docker daemon",
    "ollama: requires a running Ollama server",
]
addopts = "-m 'not live and not docker and not ollama'"
