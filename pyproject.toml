[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent"
version = "0.1.0"
description = "Agentic tool-use loop harness for local LM Studio models — an expensive-model orchestrator's free local workforce"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Dirt Simple Solutions, LLC"}]
keywords = ["llm", "agent", "lm-studio", "local-llm", "coding-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Repository = "https://github.com/JimboSchneider/localagent"

[project.scripts]
localagent = "localagent.__main__:main"

[tool.setuptools]
packages = ["localagent"]

[tool.pytest.ini_options]
markers = ["live: requires a running LM Studio server"]
addopts = "-m 'not live'"
