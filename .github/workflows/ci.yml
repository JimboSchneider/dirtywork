name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"   # floor — system Python on older macOS
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      # Unit suite only — the live suite (-m live) needs a running LM Studio
      # and is excluded by the default addopts in pyproject.toml.
      - run: python -m pytest -v

  gate:
    # Single stable name for branch protection to require, regardless of
    # how the matrix above evolves.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "all matrix legs green"
