name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"   # floor — system Python on older macOS
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      # Unit suite only — the live suite (-m live) needs a running LM Studio
      # and is excluded by the default addopts in pyproject.toml.
      - run: python -m pytest -v

  gate:
    # Single stable name for branch protection to require, regardless of
    # how the matrix above evolves.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "all matrix legs green"
