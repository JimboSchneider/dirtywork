name: Publish worker image to GHCR

# The dirtywork/worker image is published to GitHub Container Registry
# (ghcr.io), not Docker Hub: it needs no separate account or long-lived
# token -- this workflow already gets a scoped, expiring GITHUB_TOKEN with
# packages:write via `permissions:` below -- and the image lives right next
# to the source it was built from, versioned by the same release tag.
#
# One manual step this workflow cannot do for you: the FIRST time it pushes
# a new package, GitHub defaults it to private. Visit
# https://github.com/users/jimboschneider/packages/container/dirtywork-worker/settings
# and set visibility to Public, or `docker pull` will 401 for anyone
# without access to this repo (including CI runs and end users).
#
# WHEN it publishes: only on x.y.0 releases (a new minor), or when run by hand.
# The :x.y tag is what DEFAULT_IMAGE points at and PINNED_DIGEST pins; if
# every patch release rebuilt and re-pushed it, base-layer drift would change
# the digest under an already-shipped pin. A Dockerfile fix inside a minor is
# published deliberately via workflow_dispatch and followed by a re-pin.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build/publish for (e.g. v0.4.1) — re-pin PINNED_DIGEST afterwards"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Manual runs always publish. Release runs publish only for x.y.0 tags:
    # patch releases must not rebuild the :x.y moving tag (see header), and a
    # prerelease (v0.4.1-rc1) must not overwrite it early either.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
       !github.event.release.prerelease &&
       endsWith(github.event.release.tag_name, '.0'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive image tags from the release tag
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          full="${TAG#v}"      # v0.4.0 -> 0.4.0
          minor="${full%.*}"   # 0.4.0  -> 0.4
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jimboschneider/dirtywork-worker:${{ steps.version.outputs.minor }}
            ghcr.io/jimboschneider/dirtywork-worker:${{ steps.version.outputs.full }}

      - name: Record the pushed digest
        run: |
          {
            echo "Pushed \`ghcr.io/jimboschneider/dirtywork-worker@${{ steps.build.outputs.digest }}\`."
            echo ""
            echo "Set \`docker_args.PINNED_DIGEST\` to this value."
          } >> "$GITHUB_STEP_SUMMARY"
