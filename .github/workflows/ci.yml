name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"   # floor — system Python on older macOS
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      # Unit suite only — the live suite (-m live) needs a running LM Studio
      # and is excluded by the default addopts in pyproject.toml.
      - run: python -m pytest -v

  windows-unit:
    # ADVISORY ONLY (spec §5, issue #24). Windows is NOT supported; this leg
    # exists to MEASURE what breaks there. It is a separate job, not a matrix
    # entry of `test`, and `gate` does not list it in `needs`, so it can never
    # block a merge or a release. `continue-on-error` at the job level keeps a
    # red result from failing the workflow; the same flag on the pytest step
    # (plus `if: always()` below) is what lets the report and the artifact
    # still be produced when tests fail -- which is the expected outcome.
    name: pytest (3.13, windows-latest) — advisory
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      # pyproject.toml's addopts deselect the live/docker markers here exactly as
      # they do everywhere else -- pytest reads them itself, so no shell quoting
      # is involved and PowerShell cannot mangle them.
      - run: python -m pytest --junitxml=junit-windows.xml
        continue-on-error: true
      - name: Per-file summary
        if: always()
        run: python tools/junit_summary.py junit-windows.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-windows
          path: junit-windows.xml

  docker-live:
    # The unit suite above only ever talks to a FakeDocker — this job is
    # the only place in CI that exercises the real Docker sandbox
    # end-to-end against a live daemon (container create/exec/reset/export,
    # the watchdog, volume cleanup), so it gates releases even though it
    # costs ~5-8 min per run (multi-platform-capable image build plus live
    # container churn). cache-from/cache-to (type=gha) keep repeat CI runs
    # from re-downloading the .NET SDK layer every time.
    name: docker live suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/
          load: true
          tags: ghcr.io/jimboschneider/dirtywork-worker:0.12
          cache-from: type=gha
          # ignore-error: fork PRs may not have write access to the cache scope.
          cache-to: type=gha,mode=max,ignore-error=true
      - name: Sandbox smoke (prints why start() fails)
        run: python tools/ci_sandbox_smoke.py
      - run: python -m pytest -q -rA -m docker tests/test_docker_live.py tests/test_docker_lifecycle.py
      - name: Clean up dirtywork containers/volumes
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=dirtywork.repo)
          [ -n "$ids" ] && docker rm -f $ids || true
          vols=$(docker volume ls -q --filter label=dirtywork.repo)
          [ -n "$vols" ] && docker volume rm $vols || true

  wheel-smoke:
    # The only check that catches a missing package-data entry: the unit suite
    # runs from the source tree and would pass without it.
    name: wheel smoke (build, install, contract, init, --version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv smoke && smoke/bin/pip install dist/*.whl
      # Each output goes to a file and is asserted with grep -q: a pipe's exit
      # status is its last command's, so a crash upstream would be masked.
      - run: |
          smoke/bin/dirtywork contract > contract.md && grep -q '^# Machine contract' contract.md
      - run: |
          smoke/bin/dirtywork init --stdout > skill.md && grep -q '^name: dirtywork' skill.md && grep -q 'dirtywork-skill v' skill.md
      - run: |
          smoke/bin/dirtywork --version > version.txt && grep -q '^dirtywork ' version.txt

  gate:
    # Single stable name for branch protection to require, regardless of
    # how the matrix above evolves. This is also the release gate: it now
    # requires docker-live, not just the FakeDocker-only unit suite.
    needs: [test, docker-live, wheel-smoke]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all matrix legs green"
